name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libarchive-tools
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - uses: actions/upload-artifact@v4
        with:
          name: guppy-${{ runner.os }}
          path: |
            target/release/guppy-app
            target/release/guppy-app.exe
