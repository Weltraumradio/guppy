[package]
name = "guppy-app"
version = "0.1.0"
edition = "2024"

[dependencies]
# Nur die Bildformate, die die Vorschau braucht.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
guppy-core = { version = "0.1.0", path = "../guppy-core" }
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "crisp", "web-colors", "x11", "wayland", "svg", "canvas", "smol", "image-without-codecs"] }
notify-debouncer-mini = "0.7.0"
